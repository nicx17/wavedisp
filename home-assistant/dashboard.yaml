# WaveDisp view for a Home Assistant dashboard (sections layout).
#
# Needs the entities from wavedisp.yaml and Mushroom from HACS (mode tiles).
# Add it with: Edit dashboard -> "+" (new view) -> three dots -> Edit in YAML.
# Change the address in the heading's tap_action to your Pi.

title: WaveDisp
path: wavedisp
icon: mdi:dots-grid
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: WaveDisp
        icon: mdi:dots-grid
        # Opens the full WaveDisp dashboard for colours, layouts, drawing, etc.
        tap_action:
          action: url
          url_path: http://wavedisp.local:5000
        badges:
          - type: entity
            entity: select.wavedisp_mode
      - type: tile
        entity: light.wavedisp
        name: Display
        color: orange
        features:
          - type: light-brightness
        grid_options:
          columns: full
      - type: custom:mushroom-template-card
        entity: select.wavedisp_mode
        primary: "Off"
        icon: mdi:power
        color: "{{ 'orange' if is_state(entity, 'Off') else 'disabled' }}"
        vertical: true
        tap_action:
          action: perform-action
          perform_action: select.select_option
          target:
            entity_id: select.wavedisp_mode
          data:
            option: "Off"
        grid_options:
          columns: 3
